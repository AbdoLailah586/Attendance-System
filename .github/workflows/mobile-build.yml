name: Build mobile packages
on: workflow_dispatch
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with: { name: attendance-android-debug, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
      - uses: actions/upload-artifact@v4
        with: { name: attendance-ios-simulator, path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app }
